name: dmoney_manager
description: Dmoney Manager — a simple, modern money manager app (Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  fl_chart: ^1.2.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  csv: ^8.0.0
  excel: ^4.0.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
