name: Build APK

# Manual only — no push/PR triggers (avoids workflow spam).
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --${{ inputs.build_mode }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dmoney-manager-${{ inputs.build_mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_mode }}.apk
          if-no-files-found: error
